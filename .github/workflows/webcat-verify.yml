# Written by webcat init. Checks the live site the way the extension and the auditors do; a failure is a broken site.
name: WEBCAT verify
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |                                                # webcat-cli from its schema-1 branch, built from source
          git clone --depth 1 -b schema-1 https://github.com/freedomofpress/webcat-cli "$RUNNER_TEMP/webcat-cli"
          cd "$RUNNER_TEMP/webcat-cli" && npm ci && npm run build && npm install -g .
      - run: webcat site check lsd.cat
      - run: webcat audit lsd.cat
