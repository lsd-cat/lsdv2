# Written by webcat init. A pushed tag is a release: build, sign, publish the archive, deploy.
# The clone must carry the tags: the tag at HEAD is the version, the previous tag is where the history is inherited from.
name: WEBCAT release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # upload the archive to the release
  id-token: write     # the Sigstore identity the enrollment names
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Hugo CLI
        env:
          HUGO_VERSION: 0.149.0
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify                                    # must produce public/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |                                                # webcat-cli from its schema-1 branch, built from source
          git clone --depth 1 -b schema-1 https://github.com/freedomofpress/webcat-cli "$RUNNER_TEMP/webcat-cli"
          cd "$RUNNER_TEMP/webcat-cli" && npm ci && npm run build && npm install -g .
      # imgs/bg.jpg is rotated hourly on the servers, so it cannot be in the manifest
      - run: webcat release --type sigstore --exclude imgs/bg.jpg
      - run: gh release create "$GITHUB_REF_NAME" site-*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cp -r .well-known public/
      # deploy public/ (or the site-*.tar.gz archive, same content) as usual; webcat-verify.yml then checks what visitors and auditors see
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
